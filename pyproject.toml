[project]
name = "reminder-scheduler"
version = "1.1.0"
description = ""
authors = [
    {name = "Reach Digital Health", email = "dev@reachdigitalhealth.org"},
]
license = {text = "BSD"}
readme = "README.rst"
requires-python = ">=3.10,<4.0"
dependencies = [
    "celery>=5.2.7",
    "dj-database-url>=2.2.0",
    "django>=3.2.0",
    "django-celery-beat>=2.5.0",
    "django-environ>=0.4.5",
    "djangorestframework>=3.15.1",
    "psycopg2-binary>=2.9.10",
    "sentry-sdk>=1.14.0",
    "redis>=4.4.4",
    "requests>=2.32.3",
    "phonenumbers>=8.13.48",
    "pytz>=2024.2",
    "djangorestframework>=3.15.1",
]

[project.urls]
repository = "http://github.com/praekeltfoundation/reminder-scheduler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "config",
  "quickreplies",
  "rapidpro_api",
  "scheduler",

]

[dependency-groups]
dev = [
    "ruff<1.0.0,>=0.6.9",
    "pytest-django<5.0.0,>=4.9.0",
    "pytest-cov<6.0.0,>=5.0.0",
    "responses<1.0.0,>=0.25.3",
]

[tool.pytest.ini_options]
filterwarnings = ['ignore::DeprecationWarning',]
python_files = "test*.py"
addopts = "--verbose --ds=config.settings.test"

[tool.ruff]
extend-exclude = [
    "*/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes == flake8 - mccabe
    "I",           # isort
    "UP",          # pyupgrade
    "S",           # flake8-bandit
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    # "DJ",          # flake8-django
    "PIE",         # flake8-pie
    # "PT",          # flake8-pytest-style
    "SIM",         # flake8-simplify
    "PTH",         # flake8-use-pathlib
    "RUF",         # ruff-specific rules
]

ignore = [
    "E501",  # TODO: Something about these long lines.
    "S113",  # TODO: Add request timeouts.
    "PTH118", # TODO: Switch to pathlib
    "RUF012", # We usually want immutable instance attributes
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",  # It's okay to use `assert` in tests.
]

# TODO: Move this somewhere sensible?
"**/tests.py" = [
    "S101",  # It's okay to use `assert` in tests.
]

"**/config/settings/{test,dev}.py" = [
    "S104",  # It's okay to bind to all interfaces in tests
    "F405", # Its okay to import * in settings
    "S105", # Its okay to have hardcoded secrets in test config
]
